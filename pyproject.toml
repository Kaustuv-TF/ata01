[project]
name = "ata"
version = "0.1.0"
description = "ATA-01: paper-first, risk-gated autonomous trading pilot (INR 10,000 mandate)"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.6",
]

[project.scripts]
ata = "ata:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/ata"]

[tool.coverage.run]
source = ["ata"]
